name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci && npm test
        working-directory: backend
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: pip install -r requirements.txt && pytest -q
        working-directory: ai-service
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cp backend/.env.example backend/.env && cp ai-service/.env.example ai-service/.env && sed -i 's/AI_PROVIDER=openai/AI_PROVIDER=mock/' ai-service/.env
      - run: docker compose up --build -d
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color
